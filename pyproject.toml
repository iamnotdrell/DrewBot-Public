[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drewbot"
version = "0.1.0"
description = "Chessformer-inspired chess modeling and alpha-beta search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-chess==1.999",
    "numpy>=1.26,<3",
    "torch>=2.6,<3",
    "psutil>=5.9,<8",
    "zstandard>=0.22,<1",
    "tensorboard>=2.16,<3",
]

[project.scripts]
drewbot-data = "drewbot.data.cli:main"
drewbot-search = "drewbot.search.cli:console_main"
drewbot-train = "drewbot.training.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
plots = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
